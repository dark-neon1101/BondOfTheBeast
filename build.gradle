plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
	maven { url 'https://maven.azuredoom.com/mods' }
	maven { url 'https://dl.cloudsmith.io/public/azuredoom-mods/azurelib/maven/' }
	maven { url 'https://maven.wispforest.io/releases/' }

	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
	exclusiveContent {
		forRepository { maven { url "https://cursemaven.com" } }
		filter { includeGroup "curse.maven" }
	}

	maven { url = "https://maven.quiltmc.org/repository/release" }
	maven { url = "https://maven.ladysnake.org/releases" }
	maven { url = "https://maven.cafeteria.dev" }
	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content { includeGroup "com.jamieswhiteshirt" }
	}
	maven { url = "https://masa.dy.fi/maven" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.shedaniel.me" }
	maven { url = "https://maven.terraformersmc.com" }
	maven { url 'https://maven.kosmx.dev/' }
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
	maven { url "https://maven.ryanliptak.com/" }
	mavenLocal()
}

dependencies {
	modImplementation fileTree(dir: 'libs', include: ['*.jar'])
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim}"
	include "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim}"
	// AzureLib
	modImplementation "mod.azure.azurelib:azurelib-fabric-1.20.1:${project.azurelib_version}"

	// Owo
	modCompileOnly "io.wispforest:owo-lib:${project.owo_version}"
	modRuntimeOnly "io.wispforest:owo-lib:${project.owo_version}"

	// Satin
	modImplementation "org.ladysnake:satin:${project.satin_version}"

	// Reach Entity Attributes
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:${project.reach_version}"

	// Apoli
	modImplementation "io.github.apace100:apoli:${project.apoli_version}"

	// Pehkui
	modApi("com.github.Virtuoel:Pehkui:${project.pehkui_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// Cardinal Components
	modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// Cloth Config
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// Modmenu
	modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Trinkets
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	withSourcesJar()
}

publishMods {
	file = remapJar.archiveFile
	changelog = file("CHANGELOG.md").text
	type = BETA
	modLoaders.add("fabric")

	modrinth {
		projectId = "MuoFWV6F"
		accessToken = providers.gradleProperty("MODRINTH_TOKEN")
		minecraftVersions.add(project.minecraft_version)

		requires("fabric-api")
		requires("shape-shifter-curse")
		requires("trinkets")
	}

	github {
		repository = "Cleaninn/BondOfTheBeast"
		accessToken = providers.gradleProperty("GITHUB_TOKEN")
		commitish = "master"
		tagName = "v${project.mod_version}"
	}

	curseforge {
		projectId = "1666459"
		accessToken = providers.gradleProperty("CURSEFORGE_TOKEN")
		minecraftVersions.add(project.minecraft_version)

		clientRequired = true
		serverRequired = true

		requires("fabric-api")
		requires("shape-shifter-curse")
		requires("trinkets")
	}
}